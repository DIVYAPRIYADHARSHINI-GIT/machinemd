<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MachineMD - predictive maintenance: failure risk, health score and remaining useful life for pumps, motors, compressors and AC units." />
    <meta name="theme-color" content="#0f766e" />
    <title>MachineMD - Predictive Maintenance</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        const t = localStorage.getItem('machinemd-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
